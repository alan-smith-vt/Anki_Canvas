<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字 Canvas</title>
<style>
  @font-face {
    font-family: 'Noto Sans JP';
    src: url('NotoSansJP-VariableFont_wght.ttf') format('truetype');
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }

  :root {
    --search-scale: 2;
  }

  #app { width: 100vw; height: 100vh; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 100;
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'IBM Plex Mono', monospace;
    color: #c0c0d0;
    font-size: 13px;
    min-width: 180px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-term {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
  }
  #tooltip .tt-reading {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: #8888aa;
    margin-bottom: 8px;
  }
  #tooltip .tt-meaning {
    color: #a0a0c0;
    margin-bottom: 10px;
    font-size: 13px;
  }
  #tooltip .tt-sentence {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: #8899bb;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  #tooltip .tt-stats {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #666680;
    border-top: 1px solid #1e1e2e;
    padding-top: 8px;
  }
  #tooltip .tt-stats span { color: #9090b0; }
  #tooltip .tt-bar {
    height: 3px;
    background: #1e1e2e;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  #tooltip .tt-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.2s ease;
  }
  #tooltip .tt-radicals {
    margin-top: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }

  #kanji-picker {
    position: fixed;
    display: none;
    z-index: 100;
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 8px;
    display: none;
    gap: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #kanji-picker button {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 24px;
    background: #1a1a2a;
    color: #c0c0d0;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }
  #kanji-picker button:hover {
    background: #2a2a4a;
    color: #ffffff;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 50;
    background: #13131aee;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 14px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #666680;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #legend .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #legend .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Mini-map */
  #minimap {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 50;
    background: #13131aee;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    overflow: hidden;
  }
  #minimap canvas { display: block; }

  /* Page labels */
  #info {
    position: fixed;
    top: 16px;
    right: 60px;
    z-index: 50;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #444460;
    text-align: right;
  }

  #info-mobile {
    display: none;
    position: fixed;
    top: 16px;
    right: 60px;
    z-index: 50;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #444460;
    text-align: right;
    line-height: 1.6;
  }

  #search-box {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  }
  #search-toggle {
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    color: #444460;
    cursor: pointer;
    font-size: calc(16px * var(--search-scale));
    padding: calc(4px * var(--search-scale)) calc(6px * var(--search-scale));
    line-height: 1;
  }
  #search-toggle:hover { color: #8888aa; }
  #search-box input {
    background: #13131a;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: calc(8px * var(--search-scale)) calc(12px * var(--search-scale));
    font-family: 'Noto Sans JP', sans-serif;
    font-size: calc(13px * var(--search-scale));
    color: #c0c0d0;
    width: calc(240px * var(--search-scale));
    outline: none;
    transition: width 0.2s ease, opacity 0.2s ease, padding 0.2s ease;
  }
  #search-box input:focus { border-color: #5555ff; }
  #search-box input::placeholder { color: #444460; }
  #search-box input.collapsed {
    width: 0;
    padding: 0;
    opacity: 0;
    border: none;
    pointer-events: none;
  }

  #ui-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    background: transparent;
    border: none;
    color: #2a2a3a;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    line-height: 1;
  }
  #ui-toggle:hover { color: #444460; }

  #ui-toggle-bl {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 40;
    background: transparent;
    border: none;
    color: #2a2a3a;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    line-height: 1;
  }
  #ui-toggle-bl:hover { color: #444460; }

  /* E-ink toolbar (zoom / page nav) — hidden unless body.eink */
  #eink-bar {
    display: none;
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    gap: 6px;
    background: #ffffff;
    border: 2px solid #000000;
    border-radius: 6px;
    padding: 4px;
  }
  #eink-bar button {
    min-width: 44px;
    height: 44px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    background: #ffffff;
    color: #000000;
    border: 1px solid #000000;
    border-radius: 4px;
    padding: 0 10px;
  }
  #eink-bar #eink-page { min-width: 90px; font-size: 14px; }
  body.eink #eink-bar { display: flex; }

  /* ---------- E-ink theme: white, high contrast, no glow, no animation ---------- */
  body.eink { background: #ffffff; cursor: default; }
  body.eink * { transition: none !important; animation: none !important; box-shadow: none !important; text-shadow: none !important; }
  body.eink #tooltip {
    background: #ffffff; border: 2px solid #000000; color: #000000;
  }
  body.eink #tooltip .tt-term { color: #000000; }
  body.eink #tooltip .tt-reading { color: #333333; }
  body.eink #tooltip .tt-meaning { color: #000000; }
  body.eink #tooltip .tt-sentence { color: #222222; }
  body.eink #tooltip .tt-stats { color: #444444; border-top-color: #000000; }
  body.eink #tooltip .tt-stats span { color: #000000; }
  body.eink #tooltip .tt-bar { background: #dddddd; }
  body.eink #kanji-picker { background: #ffffff; border: 2px solid #000000; }
  body.eink #kanji-picker button { background: #ffffff; color: #000000; border: 1px solid #000000; }
  body.eink #legend, body.eink #minimap { background: #ffffff; border: 2px solid #000000; color: #000000; }
  body.eink #info, body.eink #info-mobile { color: #000000; }
  body.eink #search-toggle, body.eink #search-box input { background: #ffffff; color: #000000; border: 1px solid #000000; }
  body.eink #search-box input::placeholder { color: #777777; }
  body.eink #ui-toggle, body.eink #ui-toggle-bl, body.eink #eink-toggle { color: #000000; }
  body.eink #search-box input.collapsed { border: none; }

  #eink-toggle {
    position: fixed;
    top: 16px;
    right: 44px;
    z-index: 50;
    background: transparent;
    border: none;
    color: #2a2a3a;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    line-height: 1;
  }
  #eink-toggle:hover { color: #444460; }

  @media (max-width: 768px) {
    #info-mobile { display: block; }
    #info { display: none; }
    #search-box { display: none; }
    #search-toggle { display: none; }
    #ui-toggle-bl {display: none; }
  }

  @media (max-width: 768px) {
    #tooltip {
      padding: 16px 20px;
      min-width: 220px;
      font-size: 15px;
    }
    #tooltip .tt-term { font-size: 36px; }
    #tooltip .tt-reading { font-size: 17px; }
    #tooltip .tt-meaning { font-size: 15px; }
    #tooltip .tt-sentence { font-size: 15px; }
    #tooltip .tt-stats { font-size: 13px; gap: 20px; }
    #tooltip .tt-radicals { font-size: 15px; }
    #kanji-picker button { font-size: 32px; padding: 12px 18px; }
  }

  /* Desktop: double the base tooltip sizes */
  @media (min-width: 769px) {
    #tooltip {
      padding: 24px 32px;
      min-width: 360px;
      font-size: 26px;
    }
    #tooltip .tt-term { font-size: 56px; }
    #tooltip .tt-reading { font-size: 28px; }
    #tooltip .tt-meaning { font-size: 26px; }
    #tooltip .tt-sentence { font-size: 26px; }
    #tooltip .tt-stats { font-size: 22px; gap: 32px; }
    #tooltip .tt-radicals { font-size: 26px; }
    #tooltip .tt-bar { height: 6px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="tooltip">
  <div class="tt-term"></div>
  <div class="tt-reading"></div>
  <div class="tt-meaning"></div>
  <div class="tt-sentence"></div>
  <div class="tt-stats">
    <div><span class="tt-reviews-label">reviews</span> <span class="tt-reviews"></span></div>
    <div><span class="tt-fails-label">fails</span> <span class="tt-fails"></span></div>
    <div>rate <span class="tt-rate"></span></div>
  </div>
  <div class="tt-bar"><div class="tt-bar-fill"></div></div>
  <div class="tt-radicals"></div>
</div>

<div id="kanji-picker"></div>

<div id="legend" style="display:none">
  <div class="legend-row"><div class="legend-dot" style="background:#ff3344;box-shadow:0 0 8px #ff3344"></div> struggling</div>
  <div class="legend-row"><div class="legend-dot" style="background:#ff9933;box-shadow:0 0 6px #ff9933"></div> shaky</div>
  <div class="legend-row"><div class="legend-dot" style="background:#c0c0d0"></div> solid</div>
  <div class="legend-row"><div class="legend-dot" style="background:#333348"></div> new / unstarted</div>
</div>

<div id="minimap"><canvas id="minimap-canvas"></canvas></div>
<div id="info" style="display:none">
  drag to pan · scroll to zoom · click minimap to jump<br>
  hover to inspect · click to dismiss/cycle<br>
  right-click for radical search
</div>

<div id="search-box">
  <button id="search-toggle">⌕</button>
  <input type="text" id="search-input" class="collapsed" placeholder="search kanji, reading, meaning..." />
</div>

<button id="ui-toggle">○</button>
<button id="eink-toggle" title="toggle e-ink mode">▣</button>

<div id="eink-bar">
  <button id="eink-prev" title="previous page">‹</button>
  <button id="eink-page" title="fit current page">Page 1</button>
  <button id="eink-next" title="next page">›</button>
  <button id="eink-zoom-out" title="zoom out">−</button>
  <button id="eink-zoom-in" title="zoom in">+</button>
  <button id="eink-fit" title="fit everything">⊡</button>
</div>
<button id="ui-toggle-bl">◉</button>

<div id="info-mobile" style="display:none">
  drag to pan · pinch to zoom<br>
  tap to inspect · double tap to select<br>
  long press for radical search
</div>

<script src="vocab_data.js"></script>
<script>

// --- Themes ---
// Every color used by the canvas renderer lives here so the e-ink palette can
// swap in without touching the drawing code. The e-ink palette is white,
// high-contrast, never uses glow, and encodes red/orange tiers with font weight
// as well as color (color e-ink panels show only muted, low-saturation color).
const THEMES = {
  dark: {
    name: 'dark', glow: true,
    bg: '#0a0a0f', pageFill: '#0e0e16', pageStroke: '#1a1a2a',
    label: '#222238', labelDot: '#333355', sep: '#222238',
    radInVocab: '#556680', radNone: '#2a2a3a',
    red: '#ff3344', orange: '#ff9933', orangeGlow: '#ff993366', solid: '#c0c0d0', newc: '#333348', dim: '#1a1a28',
    hi: '#ffffff', blue: '#7799cc', blueDim: '#445570',
    hover: '#ffffff', hoverGlow: '#ffffff44',
    btnFill: '#151520', btnFillActive: '#2a2a5a', btnStroke: '#2a2a3a', btnStrokeActive: '#5555ff',
    btnText: '#444460', btnTextActive: '#8888ff',
    mmBg: '#0a0a0f', mmPage: '#151520', mmDim: '#0e0e16', mmBlueDim: '#334455', mmView: '#5555ff88',
    weight: { normal: 400, red: 400, orange: 400, hi: 400, hover: 700 },
  },
  eink: {
    name: 'eink', glow: false,
    bg: '#ffffff', pageFill: '#ffffff', pageStroke: '#000000',
    label: '#000000', labelDot: '#000000', sep: '#000000',
    radInVocab: '#000000', radNone: '#999999',
    red: '#c00000', orange: '#b05000', orangeGlow: null, solid: '#000000', newc: '#b4b4b4', dim: '#d4d4d4',
    hi: '#000000', blue: '#0040a0', blueDim: '#7090c0',
    hover: '#000000', hoverGlow: null,
    btnFill: '#ffffff', btnFillActive: '#000000', btnStroke: '#000000', btnStrokeActive: '#000000',
    btnText: '#000000', btnTextActive: '#ffffff',
    mmBg: '#ffffff', mmPage: '#e8e8e8', mmDim: '#d0d0d0', mmBlueDim: '#a0b0d0', mmView: '#000000',
    weight: { normal: 400, red: 800, orange: 600, hi: 800, hover: 800 },
  },
};
let T = THEMES.dark;

function isEinkRequested() {
  const q = new URLSearchParams(location.search).get('eink');
  if (q !== null) return q !== '0' && q !== 'false';
  try { if (localStorage.getItem('eink') === '1') return true; } catch (e) {}
  // Onyx Boox browsers usually identify themselves; harmless if they don't.
  return /boox|onyx|eink|e-ink/i.test(navigator.userAgent);
}

function applyTheme(name) {
  T = THEMES[name] || THEMES.dark;
  document.body.classList.toggle('eink', T.name === 'eink');
  try { localStorage.setItem('eink', T.name === 'eink' ? '1' : '0'); } catch (e) {}
  const dots = document.querySelectorAll('#legend .legend-dot');
  const dotColors = [T.red, T.orange, T.solid, T.newc];
  dots.forEach((d, i) => {
    d.style.background = dotColors[i];
    d.style.boxShadow = T.glow && i < 2 ? `0 0 8px ${dotColors[i]}` : 'none';
  });
  if (minimapCtx) drawMinimap();
  requestRedraw();
}

// --- Redraw scheduling ---
// The canvas is only repainted when something changed. A free-running
// requestAnimationFrame loop makes e-ink panels flicker/ghost continuously
// and burns battery everywhere else. Handlers call requestRedraw(); a
// window-level listener also catches every input event so nothing is missed.
let redrawQueued = false;
let lastDrawTime = 0;
let dragRedrawTimer = null;
const EINK_DRAG_INTERVAL_MS = 150; // throttle repaints while panning on e-ink

function requestRedraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => {
    redrawQueued = false;
    draw();
  });
}

// While dragging on e-ink, coalesce repaints so the panel is not asked to
// refresh dozens of times per second.
function requestDragRedraw() {
  if (T.name !== 'eink') { requestRedraw(); return; }
  if (dragRedrawTimer !== null) return;
  const wait = Math.max(0, EINK_DRAG_INTERVAL_MS - (performance.now() - lastDrawTime));
  dragRedrawTimer = setTimeout(() => { dragRedrawTimer = null; requestRedraw(); }, wait);
}

// --- State ---
let data = null;
let canvasEl, ctx;
let offsetX = 0, offsetY = 0, scale = 1;
let isDragging = false, dragStartX, dragStartY, dragOffsetX, dragOffsetY;
let hoveredTerm = null;
let minimapCtx;
let dismissed = new Set();
let selectedKanji = null;
let kanjiScores = new Map(); // term -> similarity score 0-1
let selectedRadical = null;
let radicalMatchTerms = new Set(); // vocab terms that contain kanji using the selected radical
let reviewPage = null;
let reviewHalf = null; // 'R' or 'L'
let termProgress = new Map(); // term -> 0(red) / 1(orange) / 2(white)
let isMinimapDragging = false;
let searchQuery = '';
let searchMatches = new Set();

// Color configuration — change prop/thresholds to recolor the whole canvas
const colorConfig = {
  prop: 'lapse_score',   // term field to color by (e.g. 'lapses', 'fail_rate', 'fails',
                    // 'ivl (negative)', 'lapse_score', 'recent_lapses')
  thresh2: 2,       // above this = red (struggling)
  thresh1: 1,       // above this = orange (shaky), at or below = white (solid)
};

// Returns 'red', 'orange', or 'white' based on colorConfig
function termTier(term) {
  const val = term[colorConfig.prop] || 0;
  if (val > colorConfig.thresh2) return 'red';
  if (val > colorConfig.thresh1) return 'orange';
  return 'white';
}

// Whether a term is "highlighted" (orange or red) for dismiss/click purposes
function termIsHighlighted(term) {
  return term.status !== 'new' && termTier(term) !== 'white';
}

//Touch states
let lastTouchEnd = 0;
let longPressTimer = null;
let touchStartPos = null;
let pinchStartDist = null;
let pinchStartScale = null;
let pinchMidX = null;
let pinchMidY = null;
let isTouchDragging = false;
let longPressTriggered = false;
let singleTapTimer = null;
let pendingTapPos = null;


// --- Color Mapping ---
function getTermColor(term) {
  const isRadical = term.type === 'radical';

  // Radical selection mode (right-clicked a radical)
  if (selectedRadical) {
    if (isRadical) {
      if (term.term === selectedRadical) return { fill: T.hi, glow: T.hi, weight: T.weight.hi };
      return { fill: T.dim, glow: null };
    }
    if (radicalMatchTerms.has(term)) return { fill: T.hi, glow: T.hi, weight: T.weight.hi };
    return { fill: T.dim, glow: null };
  }

  // Kanji similarity mode — dim radicals, normal logic for vocab
  if (selectedKanji && kanjiScores.size > 0) {
    if (isRadical) {
      // Highlight radicals that belong to the selected kanji
      const kanjiRads = data.radicals[selectedKanji] || [];
      if (kanjiRads.includes(term.term)) return { fill: T.blue, glow: T.blue, weight: T.weight.hi };
      return { fill: T.dim, glow: null };
    }
    return { fill: T.dim, glow: null };
  }

  // Search mode
  if (searchQuery !== '') {
    if (searchMatches.has(term)) return { fill: T.hi, glow: T.hi, weight: T.weight.hi };
    return { fill: T.dim, glow: null };
  }

  // Radical terms default coloring
  if (isRadical) {
    if (term.vocab_count > 0) return { fill: T.radInVocab, glow: null };
    return { fill: T.radNone, glow: null };
  }

  // Term has progress entry
  if (termProgress.has(term)) {
    const p = termProgress.get(term);
    if (p === 0) return { fill: T.red, glow: T.red, weight: T.weight.red };
    if (p === 1) return { fill: T.orange, glow: T.orangeGlow, weight: T.weight.orange };
    return { fill: T.solid, glow: null };
  }

  // Dismissed
  if (dismissed.has(term)) return { fill: T.solid, glow: null };

  // Review mode active — dim terms not in active half
  if (reviewPage !== null) {
    const inActiveHalf = term.page === reviewPage &&
      (reviewHalf === 'R' ? term.col < 7 : term.col >= 7);
    if (!inActiveHalf) return { fill: T.newc, glow: null };
  }

  // Normal
  if (term.status === 'new') return { fill: T.newc, glow: null };
  const tier = termTier(term);
  if (tier === 'red') return { fill: T.red, glow: T.red, weight: T.weight.red };
  if (tier === 'orange') return { fill: T.orange, glow: T.orangeGlow, weight: T.weight.orange };
  return { fill: T.solid, glow: null };
}

function getGlowIntensity(term) {
  if (!T.glow) return 0;
  const isRadical = term.type === 'radical';

  // Radical selection mode
  if (selectedRadical) {
    if (isRadical && term.term === selectedRadical) return 16;
    if (!isRadical && radicalMatchTerms.has(term)) return 16;
    return 0;
  }

  if (selectedKanji && kanjiScores.size > 0) {
    if (isRadical) {
      const kanjiRads = data.radicals[selectedKanji] || [];
      if (kanjiRads.includes(term.term)) return 10;
    }
    return 0;
  }

  // Search mode
  if (searchQuery !== '') {
    if (searchMatches.has(term)) return 16;
    return 0;
  }

  if (isRadical) return 0;

  if (termProgress.has(term)) {
    const p = termProgress.get(term);
    if (p === 0) return 12;
    if (p === 1) return 6;
    return 0;
  }

  if (dismissed.has(term)) return 0;

  if (reviewPage !== null) {
    const inActiveHalf = term.page === reviewPage &&
      (reviewHalf === 'R' ? term.col < 7 : term.col >= 7);
    if (!inActiveHalf) return 0;
  }

  if (term.status === 'new') return 0;
  const tier = termTier(term);
  if (tier === 'red') return 12 + Math.min((term[colorConfig.prop] - colorConfig.thresh2) * 4, 20);
  if (tier === 'orange') return 6;
  return 0;
}

function computeKanjiScores(kanji) {
  kanjiScores.clear();
  const selectedRadicals = new Set(data.radicals[kanji] || []);

  for (const term of data.terms) {
    if (term.type === 'radical') continue;
    const charScores = {};
    for (const char of term.term) {
      if (char === kanji) {
        charScores[char] = 1;
      } else {
        const charRadicals = data.radicals[char];
        if (charRadicals && selectedRadicals.size > 0) {
          const shared = charRadicals.filter(r => selectedRadicals.has(r)).length;
          const score = shared / Math.max(selectedRadicals.size, charRadicals.length);
          if (!charScores[char] || score > charScores[char]) {
            charScores[char] = score;
          }
        }
      }
    }
    kanjiScores.set(term, charScores);
  }
}

function computeRadicalScores(radical) {
  radicalMatchTerms.clear();
  const kanjiList = data.radical_to_kanji[radical] || [];
  const kanjiSet = new Set(kanjiList);

  for (const term of data.terms) {
    if (term.type === 'radical') continue;
    for (const char of term.term) {
      if (kanjiSet.has(char)) {
        radicalMatchTerms.add(term);
        break;
      }
    }
  }
}

function getHalfTerms(pageNum, half) {
  return data.terms.filter(t => {
    if (t.page !== pageNum) return false;
    return half === 'R' ? t.col < 7 : t.col >= 7;
  });
}


// --- Init ---
function init() {
  data = VOCAB_DATA;

  // Compute radical page start for labeling
  const radicalPages = data.pages.filter(p => p.type === 'radical');
  data._radicalPageStart = radicalPages.length > 0 ? radicalPages[0].page_num : Infinity;

  // Create main canvas
  canvasEl = document.createElement('canvas');
  canvasEl.width = window.innerWidth;
  canvasEl.height = window.innerHeight;
  document.getElementById('app').appendChild(canvasEl);
  ctx = canvasEl.getContext('2d');

  // Center on the canvas content
  offsetX = (window.innerWidth - data.canvas_width * scale) / 2;
  offsetY = (window.innerHeight - data.canvas_height * scale) / 2;

  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', onSearchInput);
  searchInput.addEventListener('keydown', (e) => {
    e.stopPropagation(); // prevent canvas shortcuts if you add any later
  });

  // Minimap
  const mm = document.getElementById('minimap-canvas');
  const mmScale = 150 / Math.max(data.canvas_width, data.canvas_height);
  mm.width = Math.round(data.canvas_width * mmScale);
  mm.height = Math.round(data.canvas_height * mmScale);
  minimapCtx = mm.getContext('2d');
  mm.addEventListener('mousedown', onMinimapDown);
  mm.addEventListener('mousemove', onMinimapMove);
  mm.addEventListener('mouseup', onMinimapUp);
  mm.addEventListener('mouseleave', onMinimapUp);
  mm.addEventListener('touchstart', onMinimapTouchStart, { passive: false });
  mm.addEventListener('touchmove', onMinimapTouchMove, { passive: false });
  mm.addEventListener('touchend', onMinimapTouchEnd, { passive: false });

  // Events
  canvasEl.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  canvasEl.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('resize', onResize);
  canvasEl.addEventListener('click', onClick);
  canvasEl.addEventListener('contextmenu', onRightClick);
  canvasEl.addEventListener('touchstart', onTouchStart, { passive: false });
  canvasEl.addEventListener('touchmove', onTouchMove, { passive: false });
  canvasEl.addEventListener('touchend', onTouchEnd, { passive: false });

  document.getElementById('search-toggle').addEventListener('click', () => {
    const input = document.getElementById('search-input');
    input.classList.toggle('collapsed');
    if (!input.classList.contains('collapsed')) {
      input.focus();
    } else {
      searchQuery = '';
      searchMatches.clear();
      input.value = '';
    }
  });

  document.getElementById('ui-toggle').addEventListener('click', () => {
    const elements = ['info', 'info-mobile', 'legend'];
    const hidden = document.getElementById('legend').style.display === 'none';
    for (const id of elements) {
      document.getElementById(id).style.display = hidden ? '' : 'none';
    }
    document.getElementById('ui-toggle').textContent = hidden ? '◉' : '○';
  });

  document.getElementById('ui-toggle-bl').addEventListener('click', () => {
    const elements = ['search-box', 'minimap-canvas'];
    const hidden = document.getElementById('search-box').style.display === 'none';
    for (const id of elements) {
      document.getElementById(id).style.display = hidden ? '' : 'none';
    }
    document.getElementById('ui-toggle-bl').textContent = hidden ? '◉' : '○';
  });

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'f') {
      e.preventDefault();
      const input = document.getElementById('search-input');
      input.classList.remove('collapsed');
      input.focus();
    }
  });

  document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchQuery = '';
      searchMatches.clear();
      e.target.value = '';
      e.target.classList.add('collapsed');
      e.target.blur();
      document.getElementById('kanji-picker').style.display = 'none';
      if (selectedKanji) {
        selectedKanji = null;
        kanjiScores.clear();
      }
      if (selectedRadical) {
        selectedRadical = null;
        radicalMatchTerms.clear();
      }
      hoveredTerm = null;
      hideTooltip();
    } else {
      e.stopPropagation();
    }
  });

  // E-ink toolbar
  document.getElementById('eink-toggle').addEventListener('click', () => {
    applyTheme(T.name === 'eink' ? 'dark' : 'eink');
  });
  document.getElementById('eink-zoom-in').addEventListener('click', () => zoomAt(canvasEl.width / 2, canvasEl.height / 2, 1.25));
  document.getElementById('eink-zoom-out').addEventListener('click', () => zoomAt(canvasEl.width / 2, canvasEl.height / 2, 0.8));
  document.getElementById('eink-fit').addEventListener('click', fitAll);
  document.getElementById('eink-prev').addEventListener('click', () => fitPage(currentPageIndex() - 1));
  document.getElementById('eink-next').addEventListener('click', () => fitPage(currentPageIndex() + 1));
  document.getElementById('eink-page').addEventListener('click', () => fitPage(currentPageIndex()));

  // Any input anywhere may have changed state: repaint once after the
  // handlers run (bubble phase on window fires after the canvas handlers).
  for (const ev of ['mousedown', 'mouseup', 'click', 'contextmenu', 'wheel', 'touchstart', 'touchend', 'keydown', 'input']) {
    window.addEventListener(ev, requestRedraw, { passive: true });
  }
  window.addEventListener('mousemove', (e) => {
    if (isDragging || isMinimapDragging) requestDragRedraw();
    else if (T.name !== 'eink') requestRedraw(); // hover highlight; no hover on e-ink touch
  }, { passive: true });
  window.addEventListener('touchmove', requestDragRedraw, { passive: true });

  applyTheme(isEinkRequested() ? 'eink' : 'dark');
  drawMinimap();
  requestRedraw();
}

// --- E-ink navigation helpers (also usable from desktop) ---
function pageBounds(page) {
  const pad = data.page_padding / 2;
  const pw = 13 * data.cell_width;
  const ph = 9 * data.cell_height;
  return {
    x: page.x + pad - data.cell_width / 2 - 10,
    y: page.y + pad - data.cell_height / 2 - 40, // include label/button strip above the page
    w: pw + data.cell_width + 20,
    h: ph + data.cell_height + 50,
  };
}

function zoomAt(cx, cy, factor) {
  const newScale = Math.max(0.2, Math.min(5, scale * factor));
  const wx = (cx - offsetX) / scale;
  const wy = (cy - offsetY) / scale;
  scale = newScale;
  offsetX = cx - wx * scale;
  offsetY = cy - wy * scale;
  hideTooltip();
  hoveredTerm = null;
  updatePageLabel();
  requestRedraw();
}

function fitAll() {
  scale = Math.min(canvasEl.width / data.canvas_width, canvasEl.height / data.canvas_height) * 0.96;
  scale = Math.max(0.2, Math.min(5, scale));
  offsetX = (canvasEl.width - data.canvas_width * scale) / 2;
  offsetY = (canvasEl.height - data.canvas_height * scale) / 2;
  hideTooltip();
  hoveredTerm = null;
  updatePageLabel();
  requestRedraw();
}

// Index (into data.pages) of the page whose center is nearest the viewport center.
function currentPageIndex() {
  const vx = (canvasEl.width / 2 - offsetX) / scale;
  const vy = (canvasEl.height / 2 - offsetY) / scale;
  let best = 0, bestD = Infinity;
  data.pages.forEach((p, i) => {
    const b = pageBounds(p);
    const dx = vx - (b.x + b.w / 2), dy = vy - (b.y + b.h / 2);
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

function fitPage(index) {
  const n = data.pages.length;
  index = ((index % n) + n) % n;
  const b = pageBounds(data.pages[index]);
  const toolbarPad = T.name === 'eink' ? 70 : 10;
  scale = Math.min(canvasEl.width / b.w, (canvasEl.height - toolbarPad) / b.h) * 0.97;
  scale = Math.max(0.2, Math.min(5, scale));
  offsetX = (canvasEl.width - b.w * scale) / 2 - b.x * scale;
  offsetY = toolbarPad + (canvasEl.height - toolbarPad - b.h * scale) / 2 - b.y * scale;
  hideTooltip();
  hoveredTerm = null;
  updatePageLabel();
  requestRedraw();
}

function updatePageLabel() {
  const el = document.getElementById('eink-page');
  if (!el || !data) return;
  const p = data.pages[currentPageIndex()];
  el.textContent = p.type === 'radical'
    ? 'Rad ' + (p.page_num - data._radicalPageStart + 1)
    : 'Page ' + p.page_num;
}

// --- Drawing ---
function draw() {
  lastDrawTime = performance.now();
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Draw page backgrounds
  ctx.fillStyle = T.pageFill;
  ctx.strokeStyle = T.pageStroke;
  ctx.lineWidth = 1;
  const pw = 13 * data.cell_width;
  const ph = 9 * data.cell_height;
  const pad = data.page_padding / 2;
  for (const page of data.pages) {
    const bgX = page.x + pad - data.cell_width / 2 - 10;
    const bgY = page.y + pad - data.cell_height / 2 - 10;
    const bgW = pw + data.cell_width + 20;  // 13 gaps + 1 full cell = 14 columns covered
    const bgH = ph + data.cell_height + 20; // 9 gaps + 1 full cell = 10 rows covered
    ctx.fillRect(bgX, bgY, bgW, bgH);
    ctx.strokeRect(bgX, bgY, bgW, bgH);

    const isRadicalPage = page.type === 'radical';

    if (isRadicalPage) {
      // Radical page: simple label, no stats or review buttons
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '700 14px "IBM Plex Mono", monospace';

      ctx.fillStyle = T.labelDot;
      ctx.beginPath();
      ctx.arc(bgX + 8, bgY - 10, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = T.label;
      ctx.fillText('Radicals ' + (page.page_num - data._radicalPageStart + 1), bgX + 18, bgY - 6);

      // Radical page stats: count in vocab vs total
      const pageRads = data.terms.filter(t => t.page === page.page_num);
      const inVocab = pageRads.filter(t => t.vocab_count > 0).length;
      ctx.font = '600 11px "IBM Plex Mono", monospace';
      ctx.fillStyle = T.radInVocab;
      ctx.fillText(inVocab + '', bgX + 4, bgY - 6 + 16);
      const w1 = ctx.measureText(inVocab + '').width;
      ctx.fillStyle = T.sep;
      ctx.fillText(' · ', bgX + 4 + w1, bgY - 6 + 16);
      const w2 = ctx.measureText(' · ').width;
      ctx.fillStyle = T.radNone;
      ctx.fillText((pageRads.length - inVocab) + '', bgX + 4 + w1 + w2, bgY - 6 + 16);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = T.pageFill;
      continue;
    }

    // --- Vocab page stats and review buttons ---
    const pageTerms = data.terms.filter(t => t.page === page.page_num);
    let red = 0, orange = 0, solid = 0, newCount = 0;
    for (const t of pageTerms) {
      if (termProgress.has(t)) {
        const p = termProgress.get(t);
        if (p === 0) red++;
        else if (p === 1) orange++;
        else solid++;
      } else if (dismissed.has(t)) {
        solid++;
      } else if (t.status === 'new') {
        newCount++;
      } else if (termTier(t) === 'red') {
        red++;
      } else if (termTier(t) === 'orange') {
        orange++;
      } else {
        solid++;
      }
    }

    // Page health dot
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 14px "IBM Plex Mono", monospace';

    const totalReviewed = pageTerms.filter(t => t.status !== 'new' || termProgress.has(t)).length;
    let dotColor = T.newc;
    if (totalReviewed > 71) {
      const whiteCount = pageTerms.filter(t => {
        if (termProgress.has(t)) return termProgress.get(t) === 2;
        if (dismissed.has(t)) return true;
        return t.status !== 'new' && termTier(t) === 'white';
      }).length;
      const passRate = whiteCount / totalReviewed;
      dotColor = passRate >= 0.85 ? T.solid : passRate >= 0.70 ? T.orange : T.red;
    }

    ctx.fillStyle = dotColor;
    ctx.beginPath();
    ctx.arc(bgX + 8, bgY - 10, 4, 0, Math.PI * 2);
    ctx.fill();

    // Page label
    ctx.fillStyle = T.label;
    ctx.fillText('Page ' + page.page_num, bgX + 18, bgY - 6);

    const statsX = bgX + 4;
    const statsY = bgY - 6 + 16;
    ctx.font = '600 11px "IBM Plex Mono", monospace';
    let cx = statsX;

    const parts = [
      { text: '' + red, color: T.red },
      { text: ' · ', color: T.sep },
      { text: '' + orange, color: T.orange },
      { text: ' · ', color: T.sep },
      { text: '' + solid, color: T.solid },
      { text: ' · ', color: T.sep },
      { text: '' + newCount, color: T.newc },
    ];

    for (const part of parts) {
      ctx.fillStyle = part.color;
      ctx.fillText(part.text, cx, statsY);
      cx += ctx.measureText(part.text).width;
    }

    // Review half buttons
    const btnY = bgY - 24;
    const btnW = 28;
    const btnH = 16;
    const lBtnX = bgX + bgW - 62;
    const rBtnX = lBtnX + btnW + 2;

    // R button
    const rActive = reviewPage === page.page_num && reviewHalf === 'R';
    ctx.fillStyle = rActive ? T.btnFillActive : T.btnFill;
    ctx.strokeStyle = rActive ? T.btnStrokeActive : T.btnStroke;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(rBtnX, btnY, btnW, btnH, 3);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = rActive ? T.btnTextActive : T.btnText;
    ctx.font = '600 10px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('R', rBtnX + btnW / 2, btnY + btnH / 2);

    // L button
    const lActive = reviewPage === page.page_num && reviewHalf === 'L';
    ctx.fillStyle = lActive ? T.btnFillActive : T.btnFill;
    ctx.strokeStyle = lActive ? T.btnStrokeActive : T.btnStroke;
    ctx.beginPath();
    ctx.roundRect(lBtnX, btnY, btnW, btnH, 3);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = lActive ? T.btnTextActive : T.btnText;
    ctx.fillText('L', lBtnX + btnW / 2, btnY + btnH / 2);

    // Reset text align for rest of drawing
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = T.pageFill;
  }

  // Draw terms
  const fontSize = 20;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const term of data.terms) {
    const color = getTermColor(term);
    const glowSize = getGlowIntensity(term);

    // Glow
    if (glowSize > 0 && color.glow) {
      ctx.shadowColor = color.glow;
      ctx.shadowBlur = glowSize;
    } else {
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    // Hover highlight
    if (hoveredTerm === term) {
      if (T.glow) {
        ctx.shadowColor = T.hoverGlow;
        ctx.shadowBlur = 20;
      }
      ctx.fillStyle = T.hover;
      ctx.font = `${T.weight.hover} ${fontSize + 2}px "Noto Sans JP", sans-serif`;
    } else {
      ctx.fillStyle = color.fill;
      ctx.font = `${color.weight || T.weight.normal} ${fontSize}px "Noto Sans JP", sans-serif`;
    }

    // Draw each character vertically
    const chars = term.term.split('');
    const charSpacing = 22;
    const startY = term.y - ((chars.length - 1) * charSpacing) / 2;

    const charScores = (selectedKanji && kanjiScores.size > 0 && term.type !== 'radical') ? kanjiScores.get(term) || {} : null;

    for (let ci = 0; ci < chars.length; ci++) {
      if (charScores) {
        const score = charScores[chars[ci]] || 0;
        let w = T.weight.normal;
        if (score === 1) {
          ctx.fillStyle = T.hi;
          ctx.shadowColor = T.glow ? T.hi : 'transparent';
          ctx.shadowBlur = T.glow ? 16 : 0;
          w = T.weight.hi;
        } else if (score > 0.5) {
          ctx.fillStyle = T.blue;
          ctx.shadowColor = T.glow ? T.blue : 'transparent';
          ctx.shadowBlur = T.glow ? 10 : 0;
          w = T.weight.orange;
        } else if (score > 0.3) {
          ctx.fillStyle = T.blueDim;
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = T.dim;
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        }
        ctx.font = `${w} ${fontSize}px "Noto Sans JP", sans-serif`;
      }

      ctx.fillText(chars[ci], term.x, startY + ci * charSpacing);

      if (charScores) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
      }
    }

    // Reset shadow
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }

  ctx.restore();
  drawMinimapViewport();
  updatePageLabel();
}

function drawMinimap() {
  if (!minimapCtx || !data) return;
  const mm = minimapCtx.canvas;
  const s = mm.width / data.canvas_width;

  minimapCtx.fillStyle = T.mmBg;
  minimapCtx.fillRect(0, 0, mm.width, mm.height);

  // Page boxes
  const pw = 13 * data.cell_width;
  const ph = 9 * data.cell_height;
  const pad = data.page_padding / 2;
  minimapCtx.fillStyle = T.mmPage;
  for (const page of data.pages) {
    const bgX = page.x + pad - data.cell_width / 2 - 10;
    const bgY = page.y + pad - data.cell_height / 2 - 10;
    const bgW = pw + data.cell_width + 20;  // 13 gaps + 1 full cell = 14 columns covered
    const bgH = ph + data.cell_height + 20; // 9 gaps + 1 full cell = 10 rows covered
    minimapCtx.fillRect(bgX * s, bgY * s, bgW * s, bgH * s);
  }

  // Term dots
  for (const term of data.terms) {
    // Search mode
    if (searchQuery !== '') {
      if (searchMatches.has(term)) {
        minimapCtx.fillStyle = T.hi;
        minimapCtx.shadowColor = T.glow ? T.hi : 'transparent';
        minimapCtx.shadowBlur = T.glow ? 8 : 0;
        minimapCtx.fillRect(term.x * s - 1.5, term.y * s - 1.5, 4, 4);
        minimapCtx.shadowBlur = 0;
      } else {
        minimapCtx.fillStyle = T.mmDim;
        minimapCtx.fillRect(term.x * s - 0.5, term.y * s - 0.5, 1.5, 1.5);
      }
      continue;
    }
    // Similarity mode — exaggerate highlights
    if (selectedKanji && kanjiScores.size > 0) {
      const charScores = kanjiScores.get(term) || {};
      let bestScore = 0;
      for (const char of term.term) {
        const score = charScores[char] || 0;
        if (score > bestScore) bestScore = score;
      }
      if (bestScore === 1) {
        minimapCtx.fillStyle = T.hi;
        minimapCtx.shadowColor = T.glow ? T.hi : 'transparent';
        minimapCtx.shadowBlur = T.glow ? 8 : 0;
        minimapCtx.fillRect(term.x * s - 1.5, term.y * s - 1.5, 4, 4);
        minimapCtx.shadowBlur = 0;
      } else if (bestScore > 0.5) {
        minimapCtx.fillStyle = T.blue;
        minimapCtx.shadowColor = T.glow ? T.blue : 'transparent';
        minimapCtx.shadowBlur = T.glow ? 5 : 0;
        minimapCtx.fillRect(term.x * s - 1, term.y * s - 1, 3, 3);
        minimapCtx.shadowBlur = 0;
      } else if (bestScore > 0.3) {
        minimapCtx.fillStyle = T.mmBlueDim;
        minimapCtx.fillRect(term.x * s - 0.5, term.y * s - 0.5, 1.5, 1.5);
      } else {
        minimapCtx.fillStyle = T.mmDim;
        minimapCtx.fillRect(term.x * s - 0.5, term.y * s - 0.5, 1.5, 1.5);
      }
    } else if (selectedRadical) {
      // Radical selection mode
      const isRadical = term.type === 'radical';
      if (isRadical && term.term === selectedRadical) {
        minimapCtx.fillStyle = T.hi;
        minimapCtx.shadowColor = T.glow ? T.hi : 'transparent';
        minimapCtx.shadowBlur = T.glow ? 8 : 0;
        minimapCtx.fillRect(term.x * s - 1.5, term.y * s - 1.5, 4, 4);
        minimapCtx.shadowBlur = 0;
      } else if (!isRadical && radicalMatchTerms.has(term)) {
        minimapCtx.fillStyle = T.hi;
        minimapCtx.shadowColor = T.glow ? T.hi : 'transparent';
        minimapCtx.shadowBlur = T.glow ? 8 : 0;
        minimapCtx.fillRect(term.x * s - 1.5, term.y * s - 1.5, 4, 4);
        minimapCtx.shadowBlur = 0;
      } else {
        minimapCtx.fillStyle = T.mmDim;
        minimapCtx.fillRect(term.x * s - 0.5, term.y * s - 0.5, 1.5, 1.5);
      }
    } else {
      const color = getTermColor(term);
      minimapCtx.fillStyle = color.fill;
      minimapCtx.fillRect(term.x * s - 0.5, term.y * s - 0.5, 1.5, 1.5);
    }
  }
}

function drawMinimapViewport() {
  if (!minimapCtx || !data) return;
  const mm = minimapCtx.canvas;
  const s = mm.width / data.canvas_width;

  // Redraw base
  drawMinimap();

  // Viewport rect
  const vx = (-offsetX / scale) * s;
  const vy = (-offsetY / scale) * s;
  const vw = (canvasEl.width / scale) * s;
  const vh = (canvasEl.height / scale) * s;

  minimapCtx.strokeStyle = T.mmView;
  minimapCtx.lineWidth = T.name === 'eink' ? 2 : 1.5;
  minimapCtx.strokeRect(vx, vy, vw, vh);
}

// --- Hit Testing ---
function hitTest(mouseX, mouseY) {
  const worldX = (mouseX - offsetX) / scale;
  const worldY = (mouseY - offsetY) / scale;

  let closest = null;
  let closestDist = Infinity;

  for (const term of data.terms) {
    const chars = term.term.length;
    const halfHeight = (chars * 22) / 2;
    const dx = worldX - term.x;
    const dy = worldY - term.y;

    if (Math.abs(dx) < 18 && Math.abs(dy) < halfHeight + 10) {
      const dist = dx * dx + dy * dy;
      if (dist < closestDist) {
        closestDist = dist;
        closest = term;
      }
    }
  }
  return closest;
}

function hitTestReviewButton(mouseX, mouseY) {
  const worldX = (mouseX - offsetX) / scale;
  const worldY = (mouseY - offsetY) / scale;
  const pw = 13 * data.cell_width;
  const pad = data.page_padding / 2;

  for (const page of data.pages) {
    const bgX = page.x + pad - data.cell_width / 2 - 10;
    const bgY = page.y + pad - data.cell_height / 2 - 10;
    const btnY = bgY - 24;
    const btnW = 28;
    const btnH = 16;

    // L button first (left)
    const lBtnX = bgX + pw + data.cell_width + 20 - 62;
    if (worldX >= lBtnX && worldX <= lBtnX + btnW && worldY >= btnY && worldY <= btnY + btnH) {
      return { page: page.page_num, half: 'L' };
    }
    // R button second (right)
    const rBtnX = lBtnX + btnW + 2;
    if (worldX >= rBtnX && worldX <= rBtnX + btnW && worldY >= btnY && worldY <= btnY + btnH) {
      return { page: page.page_num, half: 'R' };
    }
  }
  return null;
}

// --- Tooltip ---
function showTooltip(term, mouseX, mouseY) {
  const tt = document.getElementById('tooltip');
  tt.querySelector('.tt-term').textContent = term.term;
  tt.querySelector('.tt-reading').textContent = term.reading;

  if (term.type === 'radical') {
    // Show only the English name, not the stats (which are shown below)
    const meaningName = term.meaning.split(' · ')[0];
    const hasName = meaningName && !meaningName.match(/^\d/);
    tt.querySelector('.tt-meaning').innerHTML = hasName ? meaningName : '';

    tt.querySelector('.tt-reviews-label').textContent = 'kanji';
    tt.querySelector('.tt-fails-label').textContent = 'in vocab';
    tt.querySelector('.tt-reviews').textContent = term.kanji_count;
    tt.querySelector('.tt-fails').textContent = term.vocab_count;
    tt.querySelector('.tt-rate').textContent = term.strokes ? term.strokes + '画' : '';
    tt.querySelector('.tt-rate').parentElement.style.display = '';
    const barFill = tt.querySelector('.tt-bar-fill');
    barFill.style.width = (term.vocab_count > 0 ? Math.min(term.vocab_count / term.kanji_count * 100, 100) : 0) + '%';
    barFill.style.background = T.radInVocab;

    // Show sample kanji that use this radical
    let radicalHTML = '';
    const kanjiList = data.radical_to_kanji[term.term] || [];
    const vocabKanji = kanjiList.filter(k => {
      return data.terms.some(t => t.type !== 'radical' && t.term.includes(k));
    });
    if (vocabKanji.length > 0) {
      radicalHTML += `<div style="color:${T.blue}">in vocab: ${vocabKanji.slice(0, 20).join(' ')}</div>`;
    }
    const otherKanji = kanjiList.filter(k => !vocabKanji.includes(k));
    if (otherKanji.length > 0) {
      radicalHTML += `<div style="color:${T.newc}">other: ${otherKanji.slice(0, 20).join(' ')}${otherKanji.length > 20 ? ' …' : ''}</div>`;
    }
    tt.querySelector('.tt-radicals').innerHTML = radicalHTML;
    tt.querySelector('.tt-sentence').style.display = 'none';
  } else {
    tt.querySelector('.tt-meaning').innerHTML = term.meaning;
    const sentEl = tt.querySelector('.tt-sentence');
    sentEl.textContent = term.sentence || '';
    sentEl.style.display = term.sentence ? '' : 'none';
    tt.querySelector('.tt-reviews-label').textContent = 'reviews';
    tt.querySelector('.tt-fails-label').textContent = colorConfig.prop;
    tt.querySelector('.tt-reviews').textContent = term.reviews;
    tt.querySelector('.tt-fails').textContent = term[colorConfig.prop] || 0;
    tt.querySelector('.tt-rate').textContent = term.status === 'new' ? 'new' : (term.fail_rate * 100).toFixed(1) + '%';
    tt.querySelector('.tt-rate').parentElement.style.display = '';

    const barFill = tt.querySelector('.tt-bar-fill');
    if (term.status === 'new') {
      barFill.style.width = '0%';
      barFill.style.background = T.newc;
    } else {
      const val = term[colorConfig.prop] || 0;
      const barMax = colorConfig.thresh2 * 2;
      barFill.style.width = Math.min(val / barMax * 100, 100) + '%';
      const tier = termTier(term);
      barFill.style.background = tier === 'red' ? T.red : tier === 'orange' ? T.orange : T.radNone;
    }

    // Radical similarity info
    let radicalHTML = '';
    if (selectedKanji && kanjiScores.size > 0) {
      const selectedRadicals = new Set(data.radicals[selectedKanji] || []);
      const charScores = kanjiScores.get(term) || {};
      for (const char of term.term) {
        const charRadicals = data.radicals[char] || [];
        const shared = charRadicals.filter(r => selectedRadicals.has(r));
        if (char === selectedKanji) {
          radicalHTML += `<div style="color:${T.hi}">${char} — exact match</div>`;
        } else if (shared.length > 0) {
          radicalHTML += `<div style="color:${T.blue}">${char} — shared: ${shared.join(' ')}</div>`;
        }
      }
    }
    tt.querySelector('.tt-radicals').innerHTML = radicalHTML;
  }

  // Position tooltip — measure real size so large tooltips stay on screen
  const ttW = tt.offsetWidth || 220;
  const ttH = tt.offsetHeight || 160;
  let tx = mouseX + 16;
  let ty = mouseY - 10;
  if (tx + ttW > window.innerWidth) tx = mouseX - ttW - 16;
  if (tx < 10) tx = 10;
  if (ty + ttH > window.innerHeight) ty = mouseY - ttH;
  if (ty < 10) ty = 10;
  tt.style.left = tx + 'px';
  tt.style.top = ty + 'px';
  tt.classList.add('visible');
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// --- Events ---
function onSearchInput(e) {
  searchQuery = e.target.value.trim().toLowerCase();
  searchMatches.clear();

  if (searchQuery === '') return;

  for (const term of data.terms) {
    const cleanReading = (term.reading || '').replace(/[。・「」]/g, '').toLowerCase();
    if (term.term.toLowerCase().includes(searchQuery) ||
        cleanReading.includes(searchQuery) ||
        (term.meaning || '').toLowerCase().includes(searchQuery)) {
      searchMatches.add(term);
    }
  }
}

function onMouseDown(e) {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragOffsetX = offsetX;
  dragOffsetY = offsetY;
  document.body.classList.add('dragging');
}

function onMouseMove(e) {
  if (isDragging) {
    offsetX = dragOffsetX + (e.clientX - dragStartX);
    offsetY = dragOffsetY + (e.clientY - dragStartY);
    hideTooltip();
    hoveredTerm = null;
  } else if (data && !isMinimapDragging) {
    const btnHit = hitTestReviewButton(e.clientX, e.clientY);
    if (btnHit) {
      hoveredTerm = null;
      canvasEl.style.cursor = 'pointer';
      hideTooltip();
    } else {
      const hit = hitTest(e.clientX, e.clientY);
      if (hit) {
        hoveredTerm = hit;
        canvasEl.style.cursor = 'pointer';
        showTooltip(hit, e.clientX, e.clientY);
      } else {
        hoveredTerm = null;
        canvasEl.style.cursor = 'grab';
        hideTooltip();
      }
    }
  }
}

function onClick(e) {
  if (Math.abs(e.clientX - dragStartX) > 3 || Math.abs(e.clientY - dragStartY) > 3) return;

  // Check review buttons first
  const btn = hitTestReviewButton(e.clientX, e.clientY);
  if (btn) {
    if (reviewPage === btn.page && reviewHalf === btn.half) {
      // Toggle off
      reviewPage = null;
      reviewHalf = null;
    } else {
      // Activate and set all terms in that half to red if not already in progress
      reviewPage = btn.page;
      reviewHalf = btn.half;
      const halfTerms = getHalfTerms(btn.page, btn.half);
      for (const term of halfTerms) {
        if (!termProgress.has(term)) {
          termProgress.set(term, 0);
        }
      }
    }
    return;
  }

  const hit = hitTest(e.clientX, e.clientY);

  // Close picker if open
  const picker = document.getElementById('kanji-picker');
  if (!hit && picker.style.display === 'flex') {
    picker.style.display = 'none';
    return;
  }

  // Clear kanji selection if clicking empty space
  if (!hit && selectedKanji) {
    selectedKanji = null;
    kanjiScores.clear();
    document.getElementById('kanji-picker').style.display = 'none';
    return;
  }

  // Clear radical selection if clicking empty space
  if (!hit && selectedRadical) {
    selectedRadical = null;
    radicalMatchTerms.clear();
    return;
  }

  // Clear search if clicking empty space
  if (!hit && searchQuery !== '') {
    searchQuery = '';
    searchMatches.clear();
    document.getElementById('search-input').value = '';
    return;
  }

  // Term click — cycle progress if it has one, or start it
  if (hit) {
    if (termProgress.has(hit)) {
      const current = termProgress.get(hit);
      if (current < 2) {
        termProgress.set(hit, current + 1);
      } else {
        // Already white, do nothing (or could cycle back)
      }
    } else if (!selectedKanji) {
      // Outside review mode, clicking a highlighted term dismisses as before
      if (termIsHighlighted(hit)) {
        if (dismissed.has(hit)) dismissed.delete(hit);
        else dismissed.add(hit);
      }
    }
  }
}

function onRightClick(e) {
  e.preventDefault();
  const hit = hitTest(e.clientX, e.clientY);
  const picker = document.getElementById('kanji-picker');

  if (!hit) {
    picker.style.display = 'none';
    selectedKanji = null;
    kanjiScores.clear();
    selectedRadical = null;
    radicalMatchTerms.clear();
    return;
  }

  // Right-clicking a radical term: reverse lookup
  if (hit.type === 'radical') {
    picker.style.display = 'none';
    selectedKanji = null;
    kanjiScores.clear();
    selectedRadical = hit.term;
    computeRadicalScores(hit.term);
    return;
  }

  // Clear radical selection when right-clicking a vocab term
  selectedRadical = null;
  radicalMatchTerms.clear();

  // Get unique kanji from the term
  const chars = [...new Set(hit.term.split(''))].filter(c => data.radicals[c]);
  if (chars.length === 0) {
    picker.style.display = 'none';
    return;
  }

  // If single kanji, select immediately
  if (chars.length === 1) {
    picker.style.display = 'none';
    selectedKanji = chars[0];
    computeKanjiScores(selectedKanji);
    return;
  }

  // Show picker
  picker.innerHTML = '';
  picker.style.display = 'flex';
  picker.style.left = e.clientX + 'px';
  picker.style.top = e.clientY + 'px';

  // Clamp to screen
  requestAnimationFrame(() => {
    const rect = picker.getBoundingClientRect();
    if (rect.right > window.innerWidth - 10) {
      picker.style.left = (window.innerWidth - rect.width - 10) + 'px';
    }
    if (rect.left < 10) picker.style.left = '10px';
    if (rect.bottom > window.innerHeight - 10) {
      picker.style.top = (window.innerHeight - rect.height - 10) + 'px';
    }
    if (rect.top < 10) picker.style.top = '10px';
  });

  for (const char of chars) {
    const btn = document.createElement('button');
    btn.textContent = char;
    btn.addEventListener('click', () => {
      picker.style.display = 'none';
      selectedKanji = char;
      computeKanjiScores(selectedKanji);
    });
    picker.appendChild(btn);
  }
}

function onMouseUp() {
  isDragging = false;
  document.body.classList.remove('dragging');
}

function onWheel(e) {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.max(0.2, Math.min(5, scale * zoomFactor));

  // Zoom toward cursor
  const wx = (e.clientX - offsetX) / scale;
  const wy = (e.clientY - offsetY) / scale;
  scale = newScale;
  offsetX = e.clientX - wx * scale;
  offsetY = e.clientY - wy * scale;

  // Update drag origin so active drag stays consistent
  if (isDragging) {
    dragOffsetX = offsetX;
    dragOffsetY = offsetY;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
  }
}

function onResize() {
  canvasEl.width = window.innerWidth;
  canvasEl.height = window.innerHeight;
  requestRedraw();
}

function getTouchDist(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function onTouchStart(e) {
  e.preventDefault();

  if (e.touches.length === 2) {
    clearTimeout(longPressTimer);
    clearTimeout(singleTapTimer);
    singleTapTimer = null;
    longPressTriggered = false;
    isTouchDragging = true; // prevent tap actions after pinch

    pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
    pinchStartScale = scale;
    pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

    // Also track for simultaneous pan
    dragStartX = pinchMidX;
    dragStartY = pinchMidY;
    dragOffsetX = offsetX;
    dragOffsetY = offsetY;
    return;
  }

  if (e.touches.length === 1) {
    const touch = e.touches[0];
    touchStartPos = { x: touch.clientX, y: touch.clientY };
    isTouchDragging = false;
    longPressTriggered = false;

    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      const hit = hitTest(touch.clientX, touch.clientY);
      const picker = document.getElementById('kanji-picker');

      if (!hit) {
        picker.style.display = 'none';
        selectedKanji = null;
        kanjiScores.clear();
        selectedRadical = null;
        radicalMatchTerms.clear();
        return;
      }

      // Long press on radical term: reverse lookup
      if (hit.type === 'radical') {
        picker.style.display = 'none';
        selectedKanji = null;
        kanjiScores.clear();
        selectedRadical = hit.term;
        computeRadicalScores(hit.term);
        return;
      }

      // Clear radical selection when long-pressing a vocab term
      selectedRadical = null;
      radicalMatchTerms.clear();

      const chars = [...new Set(hit.term.split(''))].filter(c => data.radicals[c]);
      if (chars.length === 0) {
        picker.style.display = 'none';
        return;
      }

      if (chars.length === 1) {
        picker.style.display = 'none';
        selectedKanji = chars[0];
        computeKanjiScores(selectedKanji);
        return;
      }

      picker.innerHTML = '';
      picker.style.display = 'flex';
      picker.style.left = touch.clientX + 'px';
      picker.style.top = touch.clientY + 'px';

      // Clamp to screen
      requestAnimationFrame(() => {
        const rect = picker.getBoundingClientRect();
        if (rect.right > window.innerWidth - 10) {
          picker.style.left = (window.innerWidth - rect.width - 10) + 'px';
        }
        if (rect.left < 10) picker.style.left = '10px';
        if (rect.bottom > window.innerHeight - 10) {
          picker.style.top = (window.innerHeight - rect.height - 10) + 'px';
        }
        if (rect.top < 10) picker.style.top = '10px';
      });

      for (const char of chars) {
        const btn = document.createElement('button');
        btn.textContent = char;
        btn.addEventListener('click', () => {
          picker.style.display = 'none';
          selectedKanji = char;
          computeKanjiScores(selectedKanji);
        });
        picker.appendChild(btn);
      }
      requestRedraw();
    }, 500);

    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    dragOffsetX = offsetX;
    dragOffsetY = offsetY;
  }
}

function onTouchMove(e) {
  e.preventDefault();

  if (e.touches.length === 2) {
    clearTimeout(longPressTimer);

    const newDist = getTouchDist(e.touches[0], e.touches[1]);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

    if (pinchStartDist !== null) {
      // Zoom toward pinch center
      const zoomFactor = newDist / pinchStartDist;
      const newScale = Math.max(0.2, Math.min(5, pinchStartScale * zoomFactor));

      // Use original pinch midpoint as zoom anchor
      const wx = (pinchMidX - dragOffsetX) / pinchStartScale;
      const wy = (pinchMidY - dragOffsetY) / pinchStartScale;

      scale = newScale;

      // Pan: how much the midpoint has moved since start
      const panDX = midX - dragStartX;
      const panDY = midY - dragStartY;

      offsetX = dragOffsetX + panDX + (pinchMidX - wx * scale) - pinchMidX + (dragStartX - pinchMidX);
      offsetY = dragOffsetY + panDY + (pinchMidY - wy * scale) - pinchMidY + (dragStartY - pinchMidY);

      // Simplify: compute from scratch each frame
      offsetX = midX - wx * scale + (midX - pinchMidX) * 0;
      offsetY = midY - wy * scale + (midY - pinchMidY) * 0;

      // Actually let's just do it cleanly:
      // The world point under the original pinch midpoint should now be under the current midpoint
      offsetX = midX - wx * scale;
      offsetY = midY - wy * scale;
    }

    return;
  }

  if (e.touches.length === 1) {
    // If we just came from a pinch (lifted one finger), reset drag origin
    if (pinchStartDist !== null) {
      pinchStartDist = null;
      const touch = e.touches[0];
      dragStartX = touch.clientX;
      dragStartY = touch.clientY;
      dragOffsetX = offsetX;
      dragOffsetY = offsetY;
      return;
    }

    const touch = e.touches[0];
    const dx = touch.clientX - dragStartX;
    const dy = touch.clientY - dragStartY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      clearTimeout(longPressTimer);
      isTouchDragging = true;
      offsetX = dragOffsetX + dx;
      offsetY = dragOffsetY + dy;
      hideTooltip();
      hoveredTerm = null;
    }
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  clearTimeout(longPressTimer);

  // Went from 2 fingers to 1 — reset drag origin to remaining finger
  if (pinchStartDist !== null && e.touches.length === 1) {
    pinchStartDist = null;
    const touch = e.touches[0];
    dragStartX = touch.clientX;
    dragStartY = touch.clientY;
    dragOffsetX = offsetX;
    dragOffsetY = offsetY;
    return;
  }

  if (pinchStartDist !== null && e.touches.length === 0) {
    pinchStartDist = null;
    return;
  }

  if (longPressTriggered) {
    longPressTriggered = false;
    return;
  }

  // If tooltip is showing, just dismiss it
  if (hoveredTerm !== null) {
    hoveredTerm = null;
    hideTooltip();
    isTouchDragging = false;
    return;
  }

  if (isTouchDragging) {
    isTouchDragging = false;
    return;
  }

  if (!touchStartPos) return;

  if (singleTapTimer !== null) {
    clearTimeout(singleTapTimer);
    singleTapTimer = null;
    hideTooltip();

    const pos = pendingTapPos || touchStartPos;

    const btn = hitTestReviewButton(pos.x, pos.y);
    if (btn) {
      if (reviewPage === btn.page && reviewHalf === btn.half) {
        reviewPage = null;
        reviewHalf = null;
      } else {
        reviewPage = btn.page;
        reviewHalf = btn.half;
        const halfTerms = getHalfTerms(btn.page, btn.half);
        for (const term of halfTerms) {
          if (!termProgress.has(term)) {
            termProgress.set(term, 0);
          }
        }
      }
      return;
    }

    const hit = hitTest(pos.x, pos.y);
    if (hit) {
      if (hit.type !== 'radical') {
        if (termProgress.has(hit)) {
          const current = termProgress.get(hit);
          if (current < 2) termProgress.set(hit, current + 1);
        } else if (!selectedKanji) {
          if (termIsHighlighted(hit)) {
            if (dismissed.has(hit)) dismissed.delete(hit);
            else dismissed.add(hit);
          }
        }
      }
    } else if (!hit) {
      const picker = document.getElementById('kanji-picker');
      if (picker.style.display === 'flex') {
        picker.style.display = 'none';
      } else if (selectedKanji) {
        selectedKanji = null;
        kanjiScores.clear();
      } else if (selectedRadical) {
        selectedRadical = null;
        radicalMatchTerms.clear();
      }
    }

    return;
  }

  pendingTapPos = { x: touchStartPos.x, y: touchStartPos.y };
  singleTapTimer = setTimeout(() => {
    singleTapTimer = null;
    const hit = hitTest(pendingTapPos.x, pendingTapPos.y);
    if (hit) {
      hoveredTerm = hit;
      showTooltip(hit, pendingTapPos.x, pendingTapPos.y);
    } else {
      hoveredTerm = null;
      hideTooltip();
    }
    requestRedraw();
  }, 200);
}

function minimapToWorld(e) {
  const mm = e.target;
  const rect = mm.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const mmScale = mm.width / data.canvas_width;
  return { x: mx / mmScale, y: my / mmScale };
}

function centerOnWorld(worldX, worldY) {
  offsetX = canvasEl.width / 2 - worldX * scale;
  offsetY = canvasEl.height / 2 - worldY * scale;
}

function onMinimapDown(e) {
  e.preventDefault();
  isMinimapDragging = true;
  const world = minimapToWorld(e);
  centerOnWorld(world.x, world.y);
}

function onMinimapMove(e) {
  if (!isMinimapDragging) return;
  const world = minimapToWorld(e);
  centerOnWorld(world.x, world.y);
  hideTooltip();
  hoveredTerm = null;
}

function onMinimapUp() {
  isMinimapDragging = false;
}

function minimapToWorldFromTouch(touch, mm) {
  const rect = mm.getBoundingClientRect();
  const mx = touch.clientX - rect.left;
  const my = touch.clientY - rect.top;
  const mmScale = mm.width / data.canvas_width;
  return { x: mx / mmScale, y: my / mmScale };
}

function onMinimapTouchStart(e) {
  e.preventDefault();
  e.stopPropagation();
  isMinimapDragging = true;
  const world = minimapToWorldFromTouch(e.touches[0], e.target);
  centerOnWorld(world.x, world.y);
  requestRedraw();
}

function onMinimapTouchMove(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!isMinimapDragging) return;
  const world = minimapToWorldFromTouch(e.touches[0], e.target);
  centerOnWorld(world.x, world.y);
  hideTooltip();
  hoveredTerm = null;
  requestDragRedraw();
}

function onMinimapTouchEnd(e) {
  e.preventDefault();
  e.stopPropagation();
  isMinimapDragging = false;
  requestRedraw();
}

// --- Start ---
init();
</script>
