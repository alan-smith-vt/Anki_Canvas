<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pixel</title><style>
*{margin:0;box-sizing:border-box}body{background:#1a1a2e;color:#eee;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
canvas{border:1px solid #444;cursor:crosshair;image-rendering:pixelated}
.bar{display:flex;gap:8px;align-items:center}input[type=number]{width:60px;padding:4px;background:#16213e;color:#eee;border:1px solid #444;border-radius:4px}
input[type=color]{width:40px;height:32px;border:none;background:none;cursor:pointer}
button{padding:6px 14px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer}button:hover{background:#c73e54}
label{font-size:.85em;color:#aaa}
</style></head><body>
<div class="bar">
  <label>Size <input type="number" id="sz" value="16" min="1" max="128"></label>
  <input type="color" id="clr" value="#e94560">
  <button onclick="init()">New</button>
  <button onclick="save()">Save PNG</button>
  <label><input type="checkbox" id="grid" checked onchange="draw()"> Grid</label>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let S,px,painting=false;

function init(){
  S=+document.getElementById('sz').value||16;
  px=new Uint8Array(S*S*4);
  for(let i=3;i<px.length;i+=4)px[i]=255;
  fit();draw()
}

function fit(){
  const m=Math.min(innerWidth-40,innerHeight-100);
  c.width=c.height=m;c.style.width=c.style.height=m+'px'
}

function draw(){
  const w=c.width,cs=w/S;
  x.clearRect(0,0,w,w);
  for(let i=0;i<S;i++)for(let j=0;j<S;j++){
    const o=(i*S+j)*4;
    x.fillStyle=`rgb(${px[o]},${px[o+1]},${px[o+2]})`;
    x.fillRect(j*cs,i*cs,cs,cs)
  }
  if(document.getElementById('grid').checked&&cs>3){
    x.strokeStyle='rgba(255,255,255,.15)';x.lineWidth=.5;
    for(let i=0;i<=S;i++){x.beginPath();x.moveTo(i*cs,0);x.lineTo(i*cs,w);x.stroke();x.beginPath();x.moveTo(0,i*cs);x.lineTo(w,i*cs);x.stroke()}
  }
}

function pos(e){const r=c.getBoundingClientRect(),cs=c.width/S;return[Math.floor((e.clientY-r.top)/cs),Math.floor((e.clientX-r.left)/cs)]}

function paint(e){
  const[r,col]=pos(e);
  if(r<0||r>=S||col<0||col>=S)return;
  const h=document.getElementById('clr').value,o=(r*S+col)*4;
  px[o]=parseInt(h.slice(1,3),16);px[o+1]=parseInt(h.slice(3,5),16);px[o+2]=parseInt(h.slice(5,7),16);
  draw()
}

c.onpointerdown=e=>{painting=true;paint(e)};
c.onpointermove=e=>{if(painting)paint(e)};
c.onpointerup=c.onpointerleave=()=>painting=false;

function save(){
  const o=document.createElement('canvas');o.width=o.height=S;
  const ox=o.getContext('2d'),d=ox.createImageData(S,S);
  d.data.set(px);ox.putImageData(d,0,0);
  const a=document.createElement('a');a.download=`pixel_${S}x${S}.png`;a.href=o.toDataURL();a.click()
}

init();window.onresize=()=>{fit();draw()}
</script></body></html>
